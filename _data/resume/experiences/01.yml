bullets:
  id:
  - Merancang dan memelihara infrastruktur pelaporan Telegram Bot berkonkurensi tinggi untuk 48.600 pengawas lapangan (TPS); mengoptimasi backend untuk menangani lonjakan beban puncak >100.000 req/detik saat rekapitulasi suara pilkada tanpa downtime.
  - Mengembangkan pipeline validasi data dan rekapitulasi otomatis secara real-time untuk menjamin keakuratan verifikasi data penghitungan suara.
  en:
  - Architected and maintained a high-concurrency Telegram Bot reporting infrastructure serving 48,600 field inspectors; scaled backend handling to peak loads of >100,000 req/sec during regional election vote-counting with zero catastrophic downtime.
  - Engineered real-time data ingestion pipelines and automated validation routines to ensure high-accuracy election tally verification.
