{% assign locale = page.lang | default: 'id' %}
{% assign skills = site.data.skills | sort %}
<div class="space-y-1.5 skills-block">
    {% for pair in skills %}
    {% assign cat = pair[1] %}
    <div class="skill-category">
        <strong class="text-slate-900">{{ cat.name[locale] }}:</strong>
        <span class="text-slate-700">{% for tag in cat.tags %}{{ tag.label }}{% unless forloop.last %}, {% endunless %}{% endfor %}</span>
    </div>
    {% endfor %}
</div>
